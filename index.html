<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thánh Ca Tin Lành - Sheet Nhạc</title>
    <style>
        :root {
            --header-bg: #1a4b84;
            --sub-nav-bg: #0d325c;
            --active-tab: #d9534f;
            --toolbar-bg: #eef3f8;
            --text-color: #333;
            --border-color: #d1d5db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: #f3f4f6; color: var(--text-color); }

        /* 1. Header chính */
        .site-header { background: var(--header-bg); color: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .site-title { font-size: 18px; font-weight: bold; text-decoration: none; color: #fff; }
        .header-menu { font-size: 13px; color: #e0e7ff; }

        /* 2. Tiêu đề bài hát */
        .song-header-box { background: #fff; padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .category-name { font-size: 13px; color: #6b7280; margin-bottom: 4px; }
        .song-title { font-size: 20px; font-weight: bold; color: var(--header-bg); margin-bottom: 6px; }

        /* 3. Thanh Chức Năng (Lời | Hợp âm | Sheet | Beat...) */
        .nav-tabs { display: flex; background: var(--sub-nav-bg); overflow-x: auto; white-space: nowrap; }
        .tab-item { flex: 1; min-width: 75px; text-align: center; padding: 10px 8px; color: #e2e8f0; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; background: transparent; }
        .tab-item.active { background: var(--active-tab); color: #fff; }

        /* 4. Thanh Công Cụ Sheet (Zoom & Tông) */
        .sheet-toolbar { background: var(--toolbar-bg); padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .tool-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .tool-row:last-child { margin-bottom: 0; }
        .tool-label { font-weight: bold; color: #4b5563; }

        select.zoom-select { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; font-size: 13px; }

        /* Danh sách nút Tông (-6 đến +6) */
        .key-container { display: flex; gap: 2px; align-items: center; overflow-x: auto; max-width: 100%; padding: 2px 0; }
        .key-btn { padding: 4px 7px; border: 1px solid #cbd5e1; background: #fff; font-size: 12px; cursor: pointer; border-radius: 3px; min-width: 26px; text-align: center; }
        .key-btn.active { background: var(--header-bg); color: #fff; border-color: var(--header-bg); font-weight: bold; }

        .meta-info { font-style: italic; color: #6b7280; font-size: 12px; text-align: center; margin-top: 5px; }

        /* 5. Nút chuyển bài Trước / Sau */
        .nav-buttons { display: flex; justify-content: space-between; padding: 10px 15px; background: #fff; }
        .nav-btn { text-decoration: none; color: var(--header-bg); font-weight: bold; font-size: 14px; border: 1px solid var(--header-bg); padding: 5px 12px; border-radius: 4px; }

        /* 6. Khung Hiển Thị Sheet Nhạc */
        .sheet-container { padding: 15px 10px; text-align: center; overflow-x: auto; background: #fafafa; min-height: 400px; }
        .sheet-wrapper { display: inline-block; transition: transform 0.2s ease; transform-origin: top center; }
        .sheet-wrapper img { max-width: 100%; height: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border-radius: 4px; background: #fff; }

        /* Footer */
        .footer { text-align: center; padding: 20px 10px; font-size: 12px; color: #6b7280; border-top: 1px solid var(--border-color); background: #fff; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <a href="#" class="site-title">Thánh Ca Tin Lành</a>
        <div class="header-menu">HTTLVN.org</div>
    </header>

    <!-- Thông tin bài hát -->
    <div class="song-header-box">
        <div class="category-name">Chúa Jêsus Christ Giáng Sinh</div>
        <h1 class="song-title" id="songTitle">#053. Kìa, Thiên Binh Cùng Nhau Trỗi Hát</h1>
    </div>

    <!-- Thanh chuyển chế độ -->
    <div class="nav-tabs">
        <button class="tab-item">Lời</button>
        <button class="tab-item">Hợp âm</button>
        <button class="tab-item active">Sheet Nhạc</button>
        <button class="tab-item">Beat</button>
        <button class="tab-item">Karaoke</button>
        <button class="tab-item">PPTX</button>
    </div>

    <!-- Thanh điều khiển Zoom & Tông -->
    <div class="sheet-toolbar">
        <div class="tool-row">
            <span class="tool-label">Zoom:</span>
            <select class="zoom-select" onchange="applyZoom(this.value)">
                <option value="0.5">50%</option>
                <option value="0.7">70%</option>
                <option value="0.8">80%</option>
                <option value="0.9">90%</option>
                <option value="1.0" selected>100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="1.75">175%</option>
                <option value="2.0">200%</option>
            </select>
        </div>

        <div class="tool-row">
            <span class="tool-label">Tông:</span>
            <span style="font-weight:bold;">♭</span>
            <div class="key-container" id="keyButtons"></div>
            <span style="font-weight:bold;">♯</span>
        </div>

        <div class="meta-info" id="authorMeta">
            Felix B. Mendelssohn, 1840 | Dịch lời của Charles Wesley, 1739
        </div>
    </div>

    <!-- Nút chuyển bài trên -->
    <div class="nav-buttons">
        <a href="?id=052" class="nav-btn" id="prevTop">← 052</a>
        <a href="?id=054" class="nav-btn" id="nextTop">054 →</a>
    </div>

    <!-- Khung xem Sheet nhạc -->
    <div class="sheet-container">
        <div class="sheet-wrapper" id="sheetWrapper">
            <img id="sheetImage" src="https://thanhca.httlvn.org/sheets/053.png" alt="Sheet nhạc">
        </div>
    </div>

    <!-- Nút chuyển bài dưới -->
    <div class="nav-buttons">
        <a href="?id=052" class="nav-btn" id="prevBottom">← 052</a>
        <a href="?id=054" class="nav-btn" id="nextBottom">054 →</a>
    </div>

    <footer class="footer">
        © 2026 - Bản quyền thuộc về Tổng Liên Hội - HTTLVN.org
    </footer>

    <script>
        // 1. Tạo danh sách các nút Tông từ -6 đến +6
        const keyButtonsContainer = document.getElementById('keyButtons');
        for (let i = -6; i <= 6; i++) {
            const btn = document.createElement('button');
            btn.className = `key-btn ${i === 0 ? 'active' : ''}`;
            btn.innerText = i > 0 ? `+${i}` : i;
            btn.onclick = () => selectKey(i, btn);
            keyButtonsContainer.appendChild(btn);
        }

        // 2. Hàm xử lý Zoom
        function applyZoom(scale) {
            document.getElementById('sheetWrapper').style.transform = `scale(${scale})`;
        }

        // 3. Hàm xử lý đổi Tông
        function selectKey(offset, element) {
            document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            
            // Bạn có thể đổi hình ảnh Sheet tương ứng với tông tại đây
            console.log("Đã chọn tông:", offset);
        }
    </script>
</body>
</html>
