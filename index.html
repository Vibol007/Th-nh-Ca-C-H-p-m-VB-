<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thánh Ca Tin Lành - 903 Bài Hợp Âm & Sheet Nhạc</title>
    <style>
        :root {
            --primary: #184b7a;
            --dark-bg: #0f3254;
            --accent: #d9534f;
            --gray-bg: #eef3f8;
            --border: #dcdcdc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Roboto, Arial, sans-serif; }
        body { background-color: #f2f4f7; color: #222; }

        header { background: var(--primary); color: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-weight: bold; font-size: 16px; }

        /* Thanh Tìm Kiếm & Chọn Bài */
        .search-box { background: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
        .search-box input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 120px; text-align: center; }
        .search-box button { padding: 6px 12px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .song-title-box { background: #fff; text-align: center; padding: 12px 10px; border-bottom: 1px solid var(--border); }
        .title { font-size: 18px; font-weight: bold; color: var(--primary); }

        /* Navigation Tabs */
        .tab-bar { display: flex; background: var(--dark-bg); overflow-x: auto; white-space: nowrap; }
        .tab-btn { flex: 1; min-width: 65px; padding: 10px 5px; color: #ccc; text-align: center; font-size: 13px; font-weight: bold; background: none; border: none; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: #fff; }

        /* Toolbar */
        .toolbar { background: var(--gray-bg); padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .tool-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
        select { padding: 3px 6px; border: 1px solid #ccc; border-radius: 3px; background: #fff; font-size: 12px; }

        .key-group { display: flex; gap: 1px; overflow-x: auto; max-width: 100%; padding: 2px 0; }
        .key-btn { border: 1px solid #bbb; background: #fff; padding: 3px 6px; font-size: 11px; cursor: pointer; border-radius: 2px; min-width: 24px; text-align: center; }
        .key-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }

        /* Direction Controls */
        .nav-bar { display: flex; justify-content: space-between; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--border); }
        .nav-btn { text-decoration: none; color: var(--primary); font-weight: bold; font-size: 13px; border: 1px solid var(--primary); padding: 4px 10px; border-radius: 3px; cursor: pointer; }

        /* Display Content Area */
        .content-area { padding: 15px 10px; text-align: center; overflow-x: auto; background: #fafafa; min-height: 450px; }
        .sheet-wrapper { display: inline-block; transition: transform 0.2s ease; transform-origin: top center; }
        .sheet-img { max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.2); }

        .text-box { text-align: left; max-width: 650px; margin: 0 auto; line-height: 1.9; font-size: 16px; font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 4px; }
        .chord { color: var(--accent); font-weight: bold; background: #ffe6e6; padding: 1px 4px; border-radius: 3px; }

        audio { width: 100%; max-width: 500px; margin-top: 20px; }
        footer { text-align: center; padding: 15px; font-size: 11px; color: #777; background: #fff; border-top: 1px solid var(--border); margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <a href="#">Thánh Ca Tin Lành</a>
        <span style="font-size:12px;">903 Bài Tự Động</span>
    </header>

    <!-- Ô tìm kiếm bài từ 1 - 903 -->
    <div class="search-box">
        <label for="songNumberInput"><b>Chọn bài số:</b></label>
        <input type="number" id="songNumberInput" min="1" max="903" value="53" placeholder="1 - 903">
        <button onclick="jumpToSong()">Xem Bài</button>
    </div>

    <div class="song-title-box">
        <div class="title" id="songTitleDisplay">#053. Bài Thánh Ca</div>
    </div>

    <!-- Thanh Tabs -->
    <div class="tab-bar">
        <button class="tab-btn" id="tab-lyric" onclick="switchOp('lyric')">Lời</button>
        <button class="tab-btn" id="tab-chord" onclick="switchOp('chord')">Hợp âm</button>
        <button class="tab-btn active" id="tab-sheet" onclick="switchOp('sheet')">Sheet Nhạc</button>
        <button class="tab-btn" id="tab-beat" onclick="switchOp('beat')">Nhạc</button>
        <button class="tab-btn" id="tab-karaoke" onclick="switchOp('karaoke')">Beat Karaoke</button>
    </div>

    <!-- Toolbar Điều Khiển -->
    <div class="toolbar" id="toolbar">
        <div class="tool-group" id="zoomControl">
            <label>Zoom:</label>
            <select id="zoomSelect" onchange="setZoom(this.value)">
                <option value="0.5">50%</option>
                <option value="0.7">70%</option>
                <option value="1.0" selected>100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="2.0">200%</option>
            </select>
        </div>
        <div class="tool-group">
            <label>Tông:</label>
            <span>♭</span>
            <div class="key-group" id="keyContainer"></div>
            <span>♯</span>
        </div>
    </div>

    <!-- Nút Chuyển Bài -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevSong()">← Bài trước</button>
        <button class="nav-btn" onclick="nextSong()">Bài sau →</button>
    </div>

    <!-- Hiển Thị Nội Dung -->
    <div class="content-area">
        <div id="view-sheet" class="sheet-wrapper">
            <img id="sheetImg" class="sheet-img" src="" alt="Sheet Nhạc">
        </div>

        <div id="view-text" class="text-box" style="display:none;"></div>

        <div id="view-audio" style="display:none;">
            <audio id="audioPlayer" controls src=""></audio>
        </div>
    </div>

    <footer>
        © 2026 - Bản quyền thuộc về Tổng Liên Hội - HTTLVN.org
    </footer>

    <script>
        const scale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const flatToSharp = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };

        let currentSongNum = 53;
        let currentOp = 'sheet';
        let semitoneOffset = 0;

        // Khởi tạo các nút chọn Tông
        const keyContainer = document.getElementById('keyContainer');
        for (let i = -6; i <= 6; i++) {
            const btn = document.createElement('button');
            btn.className = `key-btn ${i === 0 ? 'active' : ''}`;
            btn.innerText = i > 0 ? `+${i}` : i;
            btn.onclick = () => setKey(i, btn);
            keyContainer.appendChild(btn);
        }

        // Định dạng số thành 3 chữ số (ví dụ 5 -> "005")
        function formatID(num) {
            return String(num).padStart(3, '0');
        }

        // Tải dữ liệu động theo số bài từ 1 - 903
        function loadCurrentSong() {
            const formattedID = formatID(currentSongNum);
            document.getElementById('songNumberInput').value = currentSongNum;
            document.getElementById('songTitleDisplay').innerText = `#${formattedID}. Bài Thánh Ca Số ${currentSongNum}`;

            // Tự động gán link Sheet nhạc & Audio MP3 chính thức từ Server HTTLVN
            document.getElementById('sheetImg').src = `https://thanhca.httlvn.org/sheets/${formattedID}.png`;
            document.getElementById('audioPlayer').src = `https://thanhca.httlvn.org/mp3/${formattedID}.mp3`;

            renderTab();
        }

        function transposeChord(chord, offset) {
            return chord.replace(/([A-G][b#]?)/g, match => {
                let note = flatToSharp[match] || match;
                let index = scale.indexOf(note);
                if (index === -1) return match;
                let newIndex = (index + offset) % 12;
                if (newIndex < 0) newIndex += 12;
                return scale[newIndex];
            });
        }

        function setKey(offset, btn) {
            document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            semitoneOffset = offset;
            if (currentOp === 'chord') renderTab();
        }

        function setZoom(scaleValue) {
            document.getElementById('view-sheet').style.transform = `scale(${scaleValue})`;
        }

        function switchOp(op) {
            currentOp = op;
            renderTab();
        }

        function renderTab() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${currentOp}`);
            if (activeTab) activeTab.classList.add('active');

            const viewSheet = document.getElementById('view-sheet');
            const viewText = document.getElementById('view-text');
            const viewAudio = document.getElementById('view-audio');
            const toolbar = document.getElementById('toolbar');
            const zoomControl = document.getElementById('zoomControl');

            viewSheet.style.display = 'none';
            viewText.style.display = 'none';
            viewAudio.style.display = 'none';

            if (currentOp === 'sheet') {
                viewSheet.style.display = 'inline-block';
                toolbar.style.display = 'flex';
                zoomControl.style.display = 'flex';
            } else if (currentOp === 'lyric') {
                toolbar.style.display = 'none';
                viewText.style.display = 'block';
                viewText.innerText = `Nội dung lời nhạc bài Thánh Ca #${formatID(currentSongNum)}. (Dữ liệu hiển thị theo bài)`;
            } else if (currentOp === 'chord') {
                toolbar.style.display = 'flex';
                zoomControl.style.display = 'none';
                viewText.style.display = 'block';
                let rawChords = `1. [G] Tôn vinh Chúa [C] Thiên Thượng [D7] quyền uy...`;
                viewText.innerHTML = rawChords.replace(/\[(.*?)\]/g, (m, chord) => {
                    return `<span class="chord">[${transposeChord(chord, semitoneOffset)}]</span>`;
                });
            } else if (currentOp === 'beat' || currentOp === 'karaoke') {
                toolbar.style.display = 'none';
                viewAudio.style.display = 'block';
            }
        }

        function jumpToSong() {
            const inputVal = parseInt(document.getElementById('songNumberInput').value);
            if (inputVal >= 1 && inputVal <= 903) {
                currentSongNum = inputVal;
                loadCurrentSong();
            } else {
                alert('Vui lòng nhập số bài từ 1 đến 903!');
            }
        }

        function prevSong() {
            if (currentSongNum > 1) {
                currentSongNum--;
                loadCurrentSong();
            }
        }

        function nextSong() {
            if (currentSongNum < 903) {
                currentSongNum++;
                loadCurrentSong();
            }
        }

        // Tải bài ban đầu
        loadCurrentSong();
    </script>
</body>
</html>
