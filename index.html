<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thánh Ca Tin Lành</title>
    <style>
        :root { --primary: #1e3a8a; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --chord: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 30px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 600px; margin: 0 auto; padding: 12px; }
        .search-box { width: 100%; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; }
        .song-list { margin-top: 15px; }
        .song-item { background: var(--card-bg); padding: 14px; margin-bottom: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .song-num { background: var(--primary); color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; }
        .song-info { flex: 1; margin-left: 12px; }
        .song-title { font-weight: bold; font-size: 1.05rem; }
        .song-meta { font-size: 0.85rem; color: #64748b; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; overflow-y: auto; }
        .modal-header { background: var(--primary); color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; }
        .btn-back { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .toolbar { background: #f1f5f9; padding: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn-tool { background: white; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: bold; }
        .song-content { padding: 20px 15px; line-height: 2; font-size: 1.1rem; white-space: pre-wrap; }
        .chord { color: var(--chord); font-weight: bold; background: #dbeafe; padding: 1px 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <header><h1>Thánh Ca Tin Lành</h1></header>
    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm số bài hoặc tên bài..." oninput="filterSongs()">
        <div id="songList" class="song-list">Đang tải danh sách bài hát...</div>
    </div>

    <div id="songModal" class="modal">
        <div class="modal-header">
            <button class="btn-back" onclick="closeSong()">&larr;</button>
            <h2 id="modalTitle">Bài Hát</h2>
            <div style="width: 24px;"></div>
        </div>
        <div class="toolbar">
            <button class="btn-tool" onclick="changeKey(-1)">Tông -</button>
            <span id="keyDisplay" style="align-self: center; font-weight: bold;">Tông: G</span>
            <button class="btn-tool" onclick="changeKey(1)">Tông +</button>
            <button class="btn-tool" onclick="changeFontSize(2)">Chữ A+</button>
            <button class="btn-tool" onclick="changeFontSize(-2)">Chữ A-</button>
            <button class="btn-tool" id="btnScroll" onclick="toggleAutoScroll()">Tự cuộn: Tắt</button>
        </div>
        <div class="song-content" id="songBody"></div>
    </div>

    <script>
        let songs = [];
        let currentSong = null, currentSemitones = 0, currentFontSize = 18, isScrolling = false, scrollInterval = null;
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        fetch('songs.json')
            .then(res => res.json())
            .then(data => {
                songs = data;
                renderSongList(songs);
            })
            .catch(err => {
                document.getElementById('songList').innerHTML = 'Chưa tải được dữ liệu bài hát.';
            });

        function renderSongList(list) {
            const container = document.getElementById('songList'); 
            container.innerHTML = '';
            if(list.length === 0) { container.innerHTML = 'Không tìm thấy bài hát.'; return; }
            list.forEach(song => {
                const item = document.createElement('div'); 
                item.className = 'song-item'; 
                item.onclick = () => openSong(song);
                item.innerHTML = `<div class="song-num">${song.id}</div><div class="song-info"><div class="song-title">${song.title}</div><div class="song-meta">Tông gốc: ${song.key} | ${song.category}</div></div><div>&rsaquo;</div>`;
                container.appendChild(item);
            });
        }

        function filterSongs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderSongList(songs.filter(s => s.title.toLowerCase().includes(q) || s.id.toString().includes(q)));
        }

        function transposeChord(chord, semitones) {
            return chord.replace(/[A-G][b#]?/g, (m) => notes[(notes.indexOf(m) + semitones + 12) % 12] || m);
        }

        function renderContent() {
            if (!currentSong) return;
            let formatted = currentSong.content.replace(/\[(.*?)\]/g, (m, chord) => `<span class="chord">${chord.split('/').map(c => transposeChord(c, currentSemitones)).join('/')}</span>`);
            document.getElementById('songBody').innerHTML = formatted;
            document.getElementById('songBody').style.fontSize = currentFontSize + 'px';
        }

        function openSong(song) { currentSong = song; currentSemitones = 0; document.getElementById('modalTitle').innerText = `Bài ${song.id}: ${song.title}`; document.getElementById('keyDisplay').innerText = `Tông gốc: ${song.key}`; document.getElementById('songModal').style.display = 'block'; renderContent(); }
        function closeSong() { document.getElementById('songModal').style.display = 'none'; if (isScrolling) toggleAutoScroll(); }
        function changeKey(dir) { currentSemitones += dir; document.getElementById('keyDisplay').innerText = `Đổi tông: ${dir >= 0 ? '+' : ''}${currentSemitones}`; renderContent(); }
        function changeFontSize(delta) { currentFontSize += delta; renderContent(); }
        function toggleAutoScroll() {
            const btn = document.getElementById('btnScroll'), modal = document.getElementById('songModal');
            if (!isScrolling) { isScrolling = true; btn.innerText = 'Tự cuộn: BẬT'; scrollInterval = setInterval(() => { modal.scrollTop += 1; }, 50); }
            else { isScrolling = false; btn.innerText = 'Tự cuộn: TẮT'; clearInterval(scrollInterval); }
        }
    </script>
</body>
</html>
